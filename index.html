const firebaseConfig = {

const app = initializeApp(firebaseConfig);

const provider = new GoogleAuthProvider();

provider.setCustomParameters({

// URL สำหรับเรียก API ของ Google Apps Script Web App
const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyli-ddm_8pQc_UzAwdIyxtXDl-02cqrT0I3S3PtRNtT3Q5T_FSGJN5XAgAkhlWRobF/exec";

document.addEventListener('click', function(e){

const btn =
e.target.closest('.nav-link');

if(!btn) return;

const tabId =
btn.getAttribute('data-bs-target');

currentTab = tabId;

activateTab(tabId);

function switchView(id){

  currentView = id;

  document.getElementById(
    'mainContent'
  ).style.display =
  (id === 'mainContent')
  ? 'block'
  : 'none';

  document.getElementById(
    'globalHeader'
  ).style.display =
  (id === 'mainContent')
  ? 'flex'
  : 'none';

} 

function fmt(val){

  if(val === null || val === undefined || val === "")
    return "";

  let str = val.toString().trim().toLowerCase();

  if(str === "true")
  return '<span style="color:#111827;font-weight:700;">✅ True</span>';

  if(str === "false")
  return '<span style="color:#111827;font-weight:700;">❌ False</span>';

  if(str === "o")
    return '<span class="badge-ui badge-o">🏆 O</span>';

  if(str === "s")
    return '<span class="badge-ui badge-s">✅ S</span>';

  if(str === "u")
    return '<span class="badge-ui badge-u">❌ U</span>';

  if(str === "upskill")
    return '<span class="badge-ui badge-upskill">🚀 UpSkill</span>';

  return val;
}

async function loadScore(email){
  switchView('mainContent');

  document.getElementById('scoreContent').innerHTML = `
    <div class="text-center py-5">
      <div class="spinner-border text-success"></div>
    </div>
  `;

  try {
    const user = auth.currentUser;
    if (!user) throw new Error("No user logged in");
    
    // ดึง Token จาก Firebase Auth ส่งไปตรวจที่ Backend เพื่อความปลอดภัย
    const idToken = await user.getIdToken();

    // ทำการ fetch ยิง API ข้ามโดเมนไปที่ Google Apps Script
    const response = await fetch(GAS_API_URL, {
      method: 'POST',
      headers: {
        // ใช้ text/plain เพื่อป้องกันปัญหา CORS Preflight ของฝั่ง Browser
        'Content-Type': 'text/plain;charset=utf-8' 
      },
      body: JSON.stringify({ idToken: idToken })
    });

    const res = await response.json();

    if(res.success){
      scores = res.allData;
      window.subjectCode = (res.subjectInfo || '').trim().substring(0, 6);
      
      document.getElementById('headerUser').innerHTML = `
        <img src="${user?.photoURL || ''}" alt="Profile">
        <div class="user-meta">
          <div class="student-id">${res.studentName || '-'}</div>
          <div class="student-id">${res.studentId || '-'}</div>
          <div class="student-id">${res.subjectInfo || '-'}</div>
        </div>
      `;
      renderScores();
    } else {
      showLoginError(res.msg);
      logout().catch(err => console.error('Sign out error:', err));
    }
    
  } catch (err) {
    console.error('Fetch error:', err);
    showLoginError('เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ กรุณาลองใหม่อีกครั้ง');
    logout().catch(err => console.error('Sign out error:', err));
  }
}

async function handleLogout(){

  try {

    await logout();

    scores = {};
    userData = {};
    currentTab = '#tabDash';

    document.getElementById('headerUser').innerHTML = '';
    document.getElementById('scoreContent').innerHTML = '';
    showLoggedOutView();

  } catch (err) {

    console.error('Logout error:', err);
    showLoginError('ออกจากระบบไม่สำเร็จ กรุณารีเฟรชหน้าแล้วลองอีกครั้ง');

  }

}

function refreshCurrentPage(){

  const user =
    auth.currentUser;

  if(user){

    loadScore(user.email);

  }

}

function getR(c,label=null){

  if(!scores[c]) return "";

  const header =
    (label || scores[c].label || '')
    .toString()
    .trim();

  if(header === "")
    return "";

  return `
  <div class="data-row">
    <span>${header}</span>
    <b>${fmt(scores[c].value)}</b>
  </div>
  `;
}

function activateTab(tabId){

  document
  .querySelectorAll('.tab-pane')
  .forEach(el => {

    el.classList.remove(
      'show',
      'active'
    );

  });

  document
  .querySelectorAll('.nav-link')
  .forEach(el => {

    el.classList.remove('active');

  });

  const tab =
    document.querySelector(tabId);

  if(tab){

    tab.classList.add(
      'show',
      'active'
    );

  }

  const btn =
    document.querySelector(
      `[data-bs-target="${tabId}"]`
    );

  if(btn){

    btn.classList.add('active');

  }

}

function showLoginError(message){

  const box =
    document.getElementById("loginError");

  box.innerHTML =
  `
  <div style="display:flex;gap:10px;align-items:flex-start;">
        <div style="margin-top:4px;">
          ${message}
        </div>
  </div>
  `;

  box.style.display = "block";

}

function hideLoginError(){

  document.getElementById("loginError").style.display="none";

}

const initAuth = (
  onAuthSuccess,
  onAuthFailure
) => {

  return onAuthStateChanged(auth, async user => {

    isSigningIn = false;
    isLoggingIn = false;

    if (!user) {
      cachedAccessToken = null;
      if (onAuthFailure) onAuthFailure();
      return;
    }

    const email = (user.email || '').trim().toLowerCase();

    if (!email.endsWith('@g.swu.ac.th')) {

      await logout();
      showLoginError('กรุณาเข้าสู่ระบบด้วยบัญชี @g.swu.ac.th เท่านั้น');

      if (onAuthFailure) onAuthFailure();
      return;
    }

    if (onAuthSuccess) {
      onAuthSuccess(user, cachedAccessToken);
    }

  });

};

const googleSignIn = async () => {

  try {

    isSigningIn = true;

    const result = await signInWithPopup(auth, provider);

    console.log('Signed in as:', result.user.email);

    const credential = GoogleAuthProvider.credentialFromResult(result);

    // Access token ใช้เฉพาะกรณีเรียก Google API จาก Browser โดยตรง
    cachedAccessToken = credential?.accessToken || null;

    return {
      user: result.user,
      accessToken: cachedAccessToken
    };

  } catch (error) {

    console.error('Sign in error:', error);
    throw error;

  } finally {

    isSigningIn = false;

  }

};

const getAccessToken = async () => cachedAccessToken;

const logout = async () => {

  await signOut(auth);
  cachedAccessToken = null;

};

function showLoggedOutView(){

  document.getElementById('mainContent').style.display = 'none';
  document.getElementById('globalHeader').style.display = 'none';
  document.getElementById('loginView').style.display = 'flex';

}

async function loginGoogle(){

  // ป้องกันการกด Login ซ้ำ
  if (isLoggingIn || isSigningIn) return;

  if (!authReady) {
    showLoginError('ระบบเข้าสู่ระบบยังไม่พร้อม กรุณารอสักครู่แล้วลองใหม่');
    return;
  }

  isLoggingIn = true;
  hideLoginError();

  try {

    const result = await googleSignIn();
    const email = (result?.user?.email || '').trim().toLowerCase();

    // ตรวจสอบอีกครั้งก่อนอนุญาตให้ใช้งาน
    if (!email.endsWith('@g.swu.ac.th')) {

      await logout();
      showLoginError('กรุณาเข้าสู่ระบบด้วยบัญชี @g.swu.ac.th เท่านั้น');
      return;

    }

  } catch (err) {

    if (err.code === 'auth/popup-closed-by-user') {
      showLoginError('หน้าต่างเข้าสู่ระบบถูกปิด กรุณาลองใหม่');

    } else if (err.code === 'auth/popup-blocked') {
      showLoginError('เบราว์เซอร์บล็อก Pop-up กรุณาอนุญาต Pop-up แล้วลองใหม่');

    } else if (err.code === 'auth/cancelled-popup-request') {
      showLoginError('มีคำขอเข้าสู่ระบบซ้ำ กรุณารอสักครู่แล้วลองใหม่');

    } else if (err.code === 'auth/network-request-failed') {
      showLoginError('ไม่สามารถเชื่อมต่อเครือข่ายได้ กรุณาตรวจสอบอินเทอร์เน็ต');

    } else {
      showLoginError(`เข้าสู่ระบบไม่สำเร็จ: ${err.message || err.code || 'Unknown error'}`);
    }

  } finally {

    isLoggingIn = false;

  }

}

async function initializeAuth(){

  try {

    // เทียบเท่า firebase.auth.Auth.Persistence.NONE
    // สถานะ Login จะอยู่เฉพาะในหน่วยความจำและหายเมื่อ Refresh
    await setPersistence(auth, inMemoryPersistence);

    // ล้างสถานะ Login เดิมที่อาจเหลือจากเวอร์ชัน compat
    if (auth.currentUser) {
      await logout();
    }

    authReady = true;

    unsubscribeAuth = initAuth(
      (user) => {

        document.getElementById('loginView').style.display = 'none';
        loadScore(user.email);

      },
      () => {

        showLoggedOutView();

      }
    );

  } catch (err) {

    authReady = false;
    console.error('Firebase initialization error:', err);
    showLoginError(`ไม่สามารถเริ่มระบบเข้าสู่ระบบได้: ${err.message || err.code || 'Unknown error'}`);

  }

}

// ฟังก์ชันใน ES module จะไม่ถูกเพิ่มลง window อัตโนมัติ
// จึง expose เฉพาะฟังก์ชันที่ถูกเรียกจาก onclick ใน HTML
Object.assign(window, {
  showLoginModal,
  confirmLogin,
  handleLogout,
  refreshCurrentPage,
  getAccessToken
});

initializeAuth();

</script>
